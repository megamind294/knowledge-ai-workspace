name: Knowledge AI Workspace CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://keystone:keystone@localhost:5432/keystone_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Grounded answer acceptance
        run: npm run evaluate:grounded

      - name: Build
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYSTONE_DATABASE_PASSWORD: ci-only-url-safe-database-password
      KEYSTONE_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-40-characters
      KEYSTONE_WEB_PORT: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build production images
        run: docker compose build --pull

      - name: Start production topology
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Verify non-root runtimes
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"

      - name: Exercise built containers
        run: node scripts/smoke-containers.mjs

      - name: Remove smoke resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTONE_DATABASE_PASSWORD: ci-only-url-safe-database-password
      KEYSTONE_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-40-characters
      KEYSTONE_WEB_PORT: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build browser topology
        run: docker compose -f compose.yaml -f compose.e2e.yaml build --pull

      - name: Start browser topology
        run: docker compose -f compose.yaml -f compose.e2e.yaml up --detach --wait --wait-timeout 120

      - name: Exercise production browser flows
        run: npx playwright test

      - name: Collect privacy-safe diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.yaml -f compose.e2e.yaml ps --format json > test-results/compose-ps.json

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            test-results/browser-results.xml
            test-results/compose-ps.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove browser resources
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down --volumes --remove-orphans
